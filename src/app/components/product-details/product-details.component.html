@if (product(); as product) {
  <div class="product-details">
    <h2>Home / Plates / <span>{{ product.title }}</span></h2>
    <div class="product-detail">
      <div class="product-container">
        <div class="product-media">
          <img [src]="'assets/' + product.image" [alt]="product.title">
        </div>
        <div class="product-description">
          <div class="content">
            <span class="brand">{{ product.brand }}</span>
            <span class="title">{{ product.title }}</span>
            <p class="price">${{ product.price }}</p>
            <p class="description">{{ product.description }}</p>
          </div>
          <div class="controls-group">
            <div class="qty-buttons">
              <div class="qty-wrapper">
                <div class="qty">
                  <span>{{ quantity() }}</span>
                </div>
                <div class="btn-wrapper">
                  <button type="button" (click)="incrementQty()">+</button>
                  <button type="button" (click)="decrementQty()">-</button>
                </div>
              </div>
            </div>
            <div class="btn-wrapper-group">
              <button type="button" (click)="addToCart(product)">Add to Cart</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
}
